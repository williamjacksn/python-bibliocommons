[project]
name = "bibliocommons"
version = "2026.0"
description = "Python client library to interface with BiblioCommons library systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "cssselect>=1.3.0",
    "httpx>=0.28.1",
    "lxml>=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[[project.authors]]
name = "William Jackson"
email = "william@subtlecoolness.com"

[project.urls]
"Homepage" = "https://github.com/williamjacksn/python-bibliocommons"
"Changes" = "https://github.com/williamjacksn/python-bibliocommons/releases"
"Issues" = "https://github.com/williamjacksn/python-bibliocommons/issues"

[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.7,<0.14.0"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.40",
    "uv-build>=0.13.7",
]

[tool.ruff.lint]
extend-select = ["ANN", "DTZ", "E", "F", "FURB", "I", "ICN", "PERF", "Q", "RSE", "RUF", "S", "UP"]
